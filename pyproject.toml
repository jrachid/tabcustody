[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabcustody"
version = "0.2.1"
description = "With in-context tabular models (TabPFN, TabICL, TabDPT), the saved model file is your training data. tabcustody detects it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Rachid Jeffali" }]
keywords = ["tabpfn", "tabicl", "tabdpt", "tabular-foundation-models", "in-context-learning", "privacy", "gdpr", "data-leakage", "pickle", "mlops"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
seal = ["cryptography>=43"]

[project.scripts]
tabcustody = "tabcustody._cli:main"

[project.urls]
Homepage = "https://github.com/jrachid/tabcustody"
Repository = "https://github.com/jrachid/tabcustody"
Issues = "https://github.com/jrachid/tabcustody/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "joblib>=1.6.0",
    "hypothesis>=6.0",
    "cryptography>=43",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tabcustody"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: fits the real in-context models, slow and heavy; run before each release",
    "fuzz: generates hostile pickle streams; a nightly workflow runs many more examples",
]

[tool.mypy]
files = ["src"]
strict = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["comparisons"]

[tool.ruff.lint]
extend-select = ["ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"ci/**" = ["S102"]
