name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - name: Fuzz the reader with many more examples
        env:
          HYPOTHESIS_PROFILE: nightly
        run: uv run pytest -m fuzz
